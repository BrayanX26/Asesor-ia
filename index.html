<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asesor Financiero IA</title>
    <!-- Fuente Premium de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #000000;
            --surface: #141414;
            --surface-2: #222222;
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --nu-color: #820ad1; 
            --mp-color: #009EE3; 
            --danger: #FF453A; 
            --success: #32D74B;
        }

        html, body {
            background-color: var(--bg-base);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Luces de neón de fondo */
        body::before {
            content: ''; position: fixed; top: -10%; left: -20%; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0,0,0,0) 60%);
            z-index: -1; pointer-events: none;
        }
        body::after {
            content: ''; position: fixed; bottom: -10%; right: -20%; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, rgba(0,0,0,0) 60%);
            z-index: -1; pointer-events: none;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 20px 80px 20px;
        }

        /* --- ANIMACIONES KEYFRAMES --- */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4); }
            100% { box-shadow: 0 12px 35px rgba(168, 85, 247, 0.8); }
        }
        
        /* CORRECCIÓN: Animaciones de Toast sin doble traslación */
        @keyframes slideDownToast {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOutToast {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        .anim-fade-1 { opacity: 0; animation: slideUpFade 0.6s ease forwards; animation-delay: 0.1s; }
        .anim-fade-2 { opacity: 0; animation: slideUpFade 0.6s ease forwards; animation-delay: 0.3s; }
        .anim-fade-3 { opacity: 0; animation: slideUpFade 0.6s ease forwards; animation-delay: 0.5s; }

        /* --- NOTIFICACIONES TOAST (ALERTAS PREMIUM) --- */
        .toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px;
            pointer-events: none;
        }
        .toast {
            background: rgba(25, 25, 30, 0.95); backdrop-filter: blur(12px);
            border-left: 4px solid var(--danger); border-radius: 12px;
            color: white; padding: 15px 20px; font-weight: 500; font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 12px;
            animation: slideDownToast 0.4s ease forwards;
            width: 100%; box-sizing: border-box; /* Asegura que no se desborde */
        }
        .toast.success { border-left-color: var(--success); }
        .toast.warning { border-left-color: #f59e0b; }

        /* --- BALANCE PRINCIPAL --- */
        .balance-header { text-align: center; margin-top: 20px; margin-bottom: 30px; }
        .balance-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .balance-amount {
            font-size: 46px; font-weight: 800; letter-spacing: -1.5px; margin: 5px 0 15px 0;
            background: linear-gradient(to bottom right, #ffffff 0%, #a3a3a3 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .balance-input-wrapper {
            display: inline-flex; align-items: center; background: rgba(25, 25, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 5px 15px; transition: all 0.3s ease;
        }
        .balance-input-wrapper input {
            background: transparent; border: none; color: var(--text-main); font-size: 18px;
            font-weight: 600; text-align: center; width: 120px; padding: 5px; outline: none; transition: all 0.3s ease;
        }

        /* --- SECCIONES GENERALES --- */
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; margin-top: 30px; }

        /* --- SELECTOR DE TARJETAS --- */
        .segment-control {
            display: flex; background: var(--surface); border-radius: 12px; padding: 4px;
            margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease;
        }
        .segment-btn {
            flex: 1; padding: 10px; text-align: center; border-radius: 8px; font-size: 14px;
            font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.3s ease;
        }
        .segment-btn:active { transform: scale(0.96); }
        .segment-btn.active.nu { background: var(--nu-color); color: white; }
        .segment-btn.active.mp { background: var(--mp-color); color: white; }

        /* --- LA TARJETA DE CRÉDITO VISUAL --- */
        .credit-card-visual {
            background: linear-gradient(135deg, #b026ff 0%, #5d00ff 100%); border-radius: 20px;
            padding: 25px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4); transition: all 0.4s ease;
        }
        .credit-card-visual.mp-style {
            background: linear-gradient(135deg, #00C6FF 0%, #0072FF 100%); box-shadow: 0 10px 30px rgba(0, 158, 227, 0.4);
        }
        .card-chip {
            width: 42px; height: 30px; background: linear-gradient(135deg, #e5e7eb, #9ca3af);
            border-radius: 6px; margin-bottom: 20px; box-shadow: inset 0 0 4px rgba(0,0,0,0.2);
        }
        .card-inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card-input-group label { display: block; font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-input-group input {
            width: 100%; background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255,255,255,0.1); 
            color: #ffffff; border-radius: 8px; padding: 10px; font-size: 16px; font-weight: 600;
            box-sizing: border-box; outline: none; transition: all 0.3s ease;
        }
        .card-input-group input:focus { border-color: rgba(255,255,255,0.5); }

        /* --- EFECTO GLASSMORPHISM --- */
        .glass-panel {
            background-color: rgba(25, 25, 30, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; transition: all 0.3s ease;
        }

        /* --- INPUTS GLOBALES Y DROPDOWN CUSTOM --- */
        .input-group { margin-bottom: 15px; position: relative; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .fintech-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); color: white;
            border-radius: 12px; padding: 16px; font-size: 15px; box-sizing: border-box; outline: none; transition: all 0.3s ease;
        }
        .fintech-input:focus { border-color: rgba(168, 85, 247, 0.5); background: rgba(0,0,0,0.5); }

        /* MENÚ DESPLEGABLE PERSONALIZADO */
        .custom-select-wrapper { position: relative; width: 100%; cursor: pointer; }
        .custom-select-display {
            display: flex; justify-content: space-between; align-items: center;
        }
        .custom-select-options {
            position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px;
            background: rgba(25, 25, 30, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden; opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: all 0.3s ease; z-index: 100;
        }
        .custom-select-options.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .custom-option {
            padding: 16px; font-size: 15px; color: var(--text-muted); transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .custom-option:last-child { border-bottom: none; }
        .custom-option:hover, .custom-option.selected { background: rgba(168, 85, 247, 0.2); color: white; font-weight: 600; }
        
        /* --- BOTONES PREMIUM --- */
        .btn-premium {
            width: 100%; background: white; color: black; border: none; border-radius: 30px;
            padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
        }
        .btn-premium:active { transform: scale(0.96); }
        .btn-ia-action { 
            background: linear-gradient(135deg, #b026ff, #5d00ff); color: white; 
            animation: pulseGlow 2s infinite alternate;
        }

        /* --- LISTA DE TRANSACCIONES (MSI) --- */
        .transaction-list { margin-top: 20px; }
        .transaction-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease;
        }
        .t-info h4 { margin: 0 0 4px 0; font-size: 16px; font-weight: 600; }
        .t-info p { margin: 0; font-size: 13px; color: var(--text-muted); }
        .t-amount { text-align: right; }
        .t-amount-val { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .t-amount-btn { background: none; border: none; color: var(--danger); font-size: 12px; padding: 4px 0 0 0; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }

        .carga-mensual-box { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .carga-label { font-size: 13px; color: var(--text-muted); }
        .carga-val { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #b026ff, #5d00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .mp-style-text { background: linear-gradient(135deg, #00C6FF, #0072FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- SECCIÓN IA --- */
        .ia-container { margin-top: 40px; }
        .ia-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .ia-header h2 { margin: 0; font-size: 18px; color: white; }
        
        .chat-bubble {
            background: rgba(168, 85, 247, 0.1); border-radius: 16px; border-bottom-left-radius: 4px;
            padding: 15px; margin-top: 20px; font-size: 15px; line-height: 1.5; display: none; border: 1px solid rgba(168, 85, 247, 0.3); transition: all 0.3s ease;
        }

        /* Micrófono flotante */
        .mic-container { position: relative; }
        .mic-btn {
            position: absolute; right: 10px; bottom: 10px; width: 42px; height: 42px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; color: white;
            font-size: 18px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; backdrop-filter: blur(5px); transition: all 0.3s ease;
        }
        .mic-btn:hover { background: rgba(168, 85, 247, 0.4); }
        .mic-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

<!-- Contenedor para notificaciones Toast -->
<div id="toastContainer" class="toast-container"></div>

<div class="app-container">
    
    <!-- HEADER: BALANCE TOTAL -->
    <div class="balance-header anim-fade-1">
        <div class="balance-label">Efectivo Disponible</div>
        <div class="balance-amount">$<span id="displaySaldo">0.00</span></div>
        <div class="balance-input-wrapper">
            <span style="color: var(--text-muted);">Editar: $</span>
            <input type="number" id="saldoDebito" placeholder="0" oninput="actualizarSaldoVisual()" onchange="guardarDatos()">
        </div>
    </div>

    <!-- SELECTOR DE TARJETAS -->
    <div class="segment-control anim-fade-1">
        <div id="btnNu" class="segment-btn active nu" onclick="cambiarPestana('Nu')">Nu</div>
        <div id="btnMP" class="segment-btn" onclick="cambiarPestana('MP')">Mercado Pago</div>
    </div>

    <!-- TARJETA DE CRÉDITO (DISEÑO FÍSICO) -->
    <div id="visualCard" class="credit-card-visual anim-fade-1">
        <div class="card-chip"></div>
        
        <div class="card-inputs-grid">
            <div class="card-input-group">
                <label>Límite Total</label>
                <input type="number" id="limiteTdc" placeholder="$0.00" onchange="guardarDatos()">
            </div>
            <div class="card-input-group">
                <label>Deuda Actual</label>
                <input type="number" id="deudaTdc" placeholder="$0.00" onchange="guardarDatos()">
            </div>
            <div class="card-input-group">
                <label>Día Corte</label>
                <input type="number" id="diaCorte" placeholder="Ej. 3" onchange="guardarDatos()">
            </div>
            <div class="card-input-group">
                <label>Día Pago</label>
                <input type="number" id="diaPago" placeholder="Ej. 13" onchange="guardarDatos()">
            </div>
        </div>
    </div>

    <!-- COMPRAS A MESES (GLASSMORPHISM) -->
    <h3 class="section-title anim-fade-2">Meses sin Intereses</h3>
    
    <div class="glass-panel anim-fade-2">
        <div class="input-group">
            <input type="text" id="msiConcepto" class="fintech-input" placeholder="¿Qué compraste? (Ej. Audífonos)">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <input type="number" id="msiTotal" class="fintech-input" placeholder="Monto ($)">
            <input type="number" id="msiPlazo" class="fintech-input" placeholder="Meses (Ej. 6)">
        </div>
        <button class="btn-premium" onclick="agregarMSI()">Agregar Compra</button>
        
        <!-- Lista de transacciones -->
        <div class="transaction-list" id="listaMSI"></div>
    </div>

    <!-- Carga Mensual Total -->
    <div class="glass-panel anim-fade-2" id="msiResumen" style="display: none; margin-top: 15px;">
        <div class="carga-mensual-box" style="margin-top: 0;">
            <div class="carga-label">Carga Mensual<br>en esta tarjeta</div>
            <div class="carga-val" id="msiTotalMensual">$0.00</div>
        </div>
    </div>

    <!-- SECCIÓN IA (GLASSMORPHISM) -->
    <div class="glass-panel ia-container anim-fade-3">
        <div class="ia-header">
            <span style="font-size: 24px;">🧠</span>
            <h2>Asesor Financiero</h2>
        </div>
        
        <div class="input-group">
            <label style="color: #a855f7;">Llave API de Gemini</label>
            <input type="password" id="apiKey" class="fintech-input" placeholder="Pega tu API Key aquí" onchange="guardarDatos()">
        </div>

        <div class="input-group">
            <label>Personalidad del Asesor</label>
            <!-- Dropdown Customizado para reemplazar al gris nativo -->
            <div class="custom-select-wrapper" onclick="toggleDropdown(event)">
                <div class="fintech-input custom-select-display" id="displayPersonalidad">
                    <span>🧐 Contador Estricto</span>
                    <span style="font-size: 10px; color: var(--text-muted);">▼</span>
                </div>
                <div class="custom-select-options" id="dropdownOptions">
                    <div class="custom-option" onclick="seleccionarPersonalidad('amable', '😊 Amable y Empático', event)">😊 Amable y Empático</div>
                    <div class="custom-option selected" onclick="seleccionarPersonalidad('estricto', '🧐 Contador Estricto', event)">🧐 Contador Estricto</div>
                    <div class="custom-option" onclick="seleccionarPersonalidad('sargento', '🤬 Sargento Despiadado', event)">🤬 Sargento Despiadado</div>
                </div>
                <!-- Input oculto para guardar el valor -->
                <input type="hidden" id="nivelAgresividad" value="estricto">
            </div>
        </div>

        <div class="mic-container">
            <textarea id="preguntaIA" class="fintech-input" style="min-height: 100px; padding-right: 50px; resize: none;" placeholder="Ej. ¿Me conviene comprar unos Galaxy Buds de $3,400 a 10 MSI?"></textarea>
            <button id="btnVoz" class="mic-btn" onclick="iniciarDictado()">🎙️</button>
        </div>

        <button class="btn-premium btn-ia-action" id="btnPreguntar" onclick="preguntarIA()">Pedir Análisis</button>
        
        <div id="respuestaIA" class="chat-bubble"></div>
    </div>

</div>

<script>
    let tarjetaActual = 'Nu';
    let datosFinancieros = JSON.parse(localStorage.getItem('ia_finanzas_v2')) || {
        saldoDebito: '', apiKey: '',
        tarjetas: {
            Nu: { limiteTdc: '', deudaTdc: '', diaCorte: '', diaPago: '', msi: [] },
            MP: { limiteTdc: '', deudaTdc: '', diaCorte: '', diaPago: '', msi: [] }
        }
    };

    // --- FUNCIÓN DE ALERTA TOAST PREMIUM ---
    function mostrarAlerta(mensaje, tipo = 'error') {
        let container = document.getElementById('toastContainer');
        let toast = document.createElement('div');
        toast.className = `toast ${tipo}`;
        let icono = tipo === 'error' ? '⚠️' : (tipo === 'success' ? '✅' : '🔔');
        
        toast.innerHTML = `<span style="font-size: 20px;">${icono}</span> <div>${mensaje}</div>`;
        container.appendChild(toast);
        
        // Quitar la alerta después de 3.5 segundos
        setTimeout(() => {
            toast.style.animation = 'fadeOutToast 0.4s ease forwards';
            setTimeout(() => toast.remove(), 400);
        }, 3500);
    }

    // --- LÓGICA DEL DROPDOWN CUSTOM ---
    function toggleDropdown(e) {
        document.getElementById('dropdownOptions').classList.toggle('show');
    }
    
    function seleccionarPersonalidad(valor, texto, evento) {
        evento.stopPropagation(); 
        document.getElementById('nivelAgresividad').value = valor;
        document.getElementById('displayPersonalidad').innerHTML = `<span>${texto}</span> <span style="font-size: 10px; color: var(--text-muted);">▼</span>`;
        
        let opciones = document.querySelectorAll('.custom-option');
        opciones.forEach(opt => opt.classList.remove('selected'));
        evento.currentTarget.classList.add('selected');
        
        document.getElementById('dropdownOptions').classList.remove('show');
    }

    // Cerrar dropdown si haces click afuera
    window.onclick = function(event) {
        if (!event.target.closest('.custom-select-wrapper')) {
            let dropdown = document.getElementById('dropdownOptions');
            if (dropdown && dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
            }
        }
    }

    function actualizarSaldoVisual() {
        let saldo = document.getElementById('saldoDebito').value;
        document.getElementById('displaySaldo').innerText = saldo ? parseFloat(saldo).toLocaleString('es-MX', {minimumFractionDigits: 2}) : "0.00";
    }

    function cambiarPestana(tarjeta) {
        guardarDatos();
        tarjetaActual = tarjeta;
        
        let btnNu = document.getElementById('btnNu');
        let btnMP = document.getElementById('btnMP');
        let visualCard = document.getElementById('visualCard');
        let msiTotalText = document.getElementById('msiTotalMensual');

        btnNu.classList.remove('active', 'nu');
        btnMP.classList.remove('active', 'mp');
        
        if(tarjeta === 'Nu') {
            btnNu.classList.add('active', 'nu');
            visualCard.classList.remove('mp-style');
            msiTotalText.classList.remove('mp-style-text');
        } else {
            btnMP.classList.add('active', 'mp');
            visualCard.classList.add('mp-style');
            msiTotalText.classList.add('mp-style-text');
        }

        cargarDatosEnInputs();
        renderMSI();
    }

    function cargarUI() {
        document.getElementById('saldoDebito').value = datosFinancieros.saldoDebito;
        actualizarSaldoVisual();
        document.getElementById('apiKey').value = datosFinancieros.apiKey || '';
        cargarDatosEnInputs();
        renderMSI();
    }

    function cargarDatosEnInputs() {
        let t = datosFinancieros.tarjetas[tarjetaActual];
        document.getElementById('limiteTdc').value = t.limiteTdc;
        document.getElementById('deudaTdc').value = t.deudaTdc;
        document.getElementById('diaCorte').value = t.diaCorte;
        document.getElementById('diaPago').value = t.diaPago;
    }

    function guardarDatos() {
        datosFinancieros.saldoDebito = document.getElementById('saldoDebito').value;
        actualizarSaldoVisual();
        datosFinancieros.apiKey = document.getElementById('apiKey').value;
        
        let t = datosFinancieros.tarjetas[tarjetaActual];
        t.limiteTdc = document.getElementById('limiteTdc').value;
        t.deudaTdc = document.getElementById('deudaTdc').value;
        t.diaCorte = document.getElementById('diaCorte').value;
        t.diaPago = document.getElementById('diaPago').value;
        
        localStorage.setItem('ia_finanzas_v2', JSON.stringify(datosFinancieros));
    }

    function agregarMSI() {
        let concepto = document.getElementById('msiConcepto').value.trim();
        let total = parseFloat(document.getElementById('msiTotal').value);
        let plazo = parseInt(document.getElementById('msiPlazo').value);

        if(concepto === '' || isNaN(total) || isNaN(plazo) || total <= 0 || plazo <= 0) {
            mostrarAlerta("Por favor completa todos los datos de la compra correctamente.", "error"); 
            return;
        }

        let pagoMensual = total / plazo;
        datosFinancieros.tarjetas[tarjetaActual].msi.push({ concepto: concepto, total: total, plazo: plazo, pagoMensual: pagoMensual });
        guardarDatos();
        
        document.getElementById('msiConcepto').value = ''; document.getElementById('msiTotal').value = ''; document.getElementById('msiPlazo').value = '';
        renderMSI();
        mostrarAlerta("Compra a meses registrada con éxito.", "success");
    }

    function borrarMSI(index) {
        if(confirm("¿Eliminar esta compra?")) {
            datosFinancieros.tarjetas[tarjetaActual].msi.splice(index, 1);
            guardarDatos(); renderMSI();
            mostrarAlerta("Compra eliminada.", "warning");
        }
    }

    function renderMSI() {
        let contenedor = document.getElementById('listaMSI');
        let resumen = document.getElementById('msiResumen');
        let totalMensual = document.getElementById('msiTotalMensual');
        contenedor.innerHTML = ''; let sumaMensual = 0;

        let msiActual = datosFinancieros.tarjetas[tarjetaActual].msi;

        if(msiActual.length === 0) { resumen.style.display = 'none'; return; }

        msiActual.forEach((item, index) => {
            sumaMensual += item.pagoMensual;
            contenedor.innerHTML += `
                <div class="transaction-item">
                    <div class="t-info">
                        <h4>${item.concepto}</h4>
                        <p>$${item.total.toFixed(2)} a ${item.plazo} meses</p>
                    </div>
                    <div class="t-amount">
                        <div class="t-amount-val">-$${item.pagoMensual.toFixed(2)}</div>
                        <button class="t-amount-btn" onclick="borrarMSI(${index})">Eliminar</button>
                    </div>
                </div>`;
        });
        resumen.style.display = 'block'; 
        totalMensual.innerText = `$${sumaMensual.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
    }

    async function preguntarIA() {
        guardarDatos(); 
        let pregunta = document.getElementById('preguntaIA').value.trim();
        let apiKey = document.getElementById('apiKey').value.trim();
        let nivel = document.getElementById('nivelAgresividad').value;

        if(!apiKey) { mostrarAlerta("Primero pega tu API Key en la configuración."); return; }
        if(!pregunta) { mostrarAlerta("Escribe o dicta tu pregunta para el asesor."); return; }

        let btn = document.getElementById('btnPreguntar');
        let respDiv = document.getElementById('respuestaIA');
        
        btn.innerText = "Analizando...";
        btn.disabled = true;
        respDiv.style.display = 'block';
        respDiv.innerHTML = "<i>Conectando con el asesor...</i>";

        let Nu = datosFinancieros.tarjetas.Nu;
        let MP = datosFinancieros.tarjetas.MP;
        let cargaNu = Nu.msi.reduce((sum, item) => sum + item.pagoMensual, 0);
        let cargaMP = MP.msi.reduce((sum, item) => sum + item.pagoMensual, 0);

        let personalidad = "";
        if (nivel === "amable") {
            personalidad = "Eres un asesor financiero amable y empático. Hablas en español de México. Guías suavemente sin regañar.";
        } else if (nivel === "estricto") {
            personalidad = "Eres un asesor financiero estricto y analítico. Hablas en español de México. Eres directo y usas sus números para evidenciar errores.";
        } else if (nivel === "sargento") {
            personalidad = "Eres un sargento militar financiero, brutalmente honesto y sarcástico. Hablas en español de México. Haces sentir que sus malas decisiones son un desastre.";
        }

        let promptMaestro = `${personalidad}
Pregunta: "${pregunta}"

Datos:
- Efectivo: $${datosFinancieros.saldoDebito || 0}
NU: Límite $${Nu.limiteTdc || 0} | Deuda $${Nu.deudaTdc || 0} | Corte ${Nu.diaCorte || '?'} | Carga MSI $${cargaNu.toFixed(2)}
MP: Límite $${MP.limiteTdc || 0} | Deuda $${MP.deudaTdc || 0} | Corte ${MP.diaCorte || '?'} | Carga MSI $${cargaMP.toFixed(2)}

INSTRUCCIONES:
1. Analiza matemáticamente qué tarjeta conviene por días de corte y límite.
2. Si es mala idea, usa tu personalidad (${nivel}) para decirle por qué.
3. Si es buena idea, dile con qué tarjeta pagar.
4. Formatea con listas y negritas, sin saludos largos.`;

        try {
            let response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=" + apiKey, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptMaestro }] }] })
            });
            
            let data = await response.json();
            
            if(data.error) {
                respDiv.innerHTML = `<span style="color: #FF453A;">Error: ${data.error.message}</span>`;
            } else {
                let respuestaIA = data.candidates[0].content.parts[0].text;
                respuestaIA = respuestaIA.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                respuestaIA = respuestaIA.replace(/\*(.*?)\*/g, '<i>$1</i>');
                respDiv.innerHTML = respuestaIA;
            }
        } catch (error) {
            respDiv.innerHTML = `<span style="color: #FF453A;">Error de conexión.</span>`;
        }
        
        btn.innerText = "Pedir Análisis";
        btn.disabled = false;
    }

    function iniciarDictado() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            mostrarAlerta("El dictado por voz no es compatible con este navegador. Usa Chrome.", "error"); return;
        }
        let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = new SpeechRecognition();
        recognition.lang = 'es-MX'; recognition.interimResults = false;
        
        let btnVoz = document.getElementById('btnVoz');
        let txtPregunta = document.getElementById('preguntaIA');
        
        recognition.onstart = function() { btnVoz.innerText = "🔴"; btnVoz.style.background = "#FF453A"; };
        recognition.onresult = function(event) { txtPregunta.value += (txtPregunta.value ? " " : "") + event.results[0][0].transcript; };
        recognition.onend = function() { btnVoz.innerText = "🎙️"; btnVoz.style.background = "rgba(255,255,255,0.1)"; };
        recognition.start();
    }

    cargarUI();
</script>
</body>
</html>
